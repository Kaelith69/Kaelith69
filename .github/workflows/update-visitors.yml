name: Refresh cosmic visitor count

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmic-visitor-counter
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh the count embedded in the visitor SVG
        env:
          VISITOR_BADGE_URL: https://komarev.com/ghpvc/?username=Kaelith69&style=flat&label=VISITS&color=6C3D87
        run: python3 scripts/update_visitors.py

      - name: Commit updated visitor artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.svg
          if git diff --cached --quiet; then
            echo "Visitor count is already current."
          else
            git commit -m "Refresh cosmic profile visitor count"
            git push
          fi
