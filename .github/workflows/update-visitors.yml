name: Refresh profile visitor count

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artwork-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh visitor count
        env:
          VISITOR_BADGE_URL: https://komarev.com/ghpvc/?username=Kaelith69&style=flat&label=VISITS&color=6C3D87
        run: python scripts/update_visitors.py

      - name: Commit visitor artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.svg
          if git diff --cached --quiet; then
            echo "Visitor count is already current."
          else
            git commit -m "Refresh visitor count"
            git push origin HEAD:main
          fi
