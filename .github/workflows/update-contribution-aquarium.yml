name: Build Contribution Aquarium

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_contribution_aquarium.py"
      - ".github/workflows/update-contribution-aquarium.yml"
  pull_request:
    paths:
      - "scripts/build_contribution_aquarium.py"
      - ".github/workflows/update-contribution-aquarium.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data-refresh
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub contribution calendar and render aquarium SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          GITHUB_PROFILE_LOGIN: Kaelith69
        run: python scripts/build_contribution_aquarium.py

      - name: Validate generated SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/contributions-aquarium.svg")
          root = ET.parse(path).getroot()
          if root.tag.rsplit("}", 1)[-1] != "svg":
              raise SystemExit("Generated contribution artwork is not SVG.")
          days = root.findall(".//*[@data-date]")
          if len(days) != 365:
              raise SystemExit(f"Expected 365 contribution days, found {len(days)}.")
          if root.attrib.get("viewBox") != "0 0 1200 650":
              raise SystemExit(f"Unexpected aquarium viewBox: {root.attrib.get('viewBox')!r}.")
          if root.find(".//*[@id='resting-octopus']") is None:
              raise SystemExit("Generated aquarium is missing its octopus.")
          arms = root.findall(".//*[@data-octopus-arm='true']")
          if len(arms) != 8:
              raise SystemExit(f"Expected eight octopus arms, found {len(arms)}.")
          suckers = root.findall(".//*[@data-sucker='true']")
          if len(suckers) < 48:
              raise SystemExit(f"Expected at least 48 visible suckers, found {len(suckers)}.")
          if root.find(".//*[@id='octopus-mantle']") is None:
              raise SystemExit("Generated aquarium is missing its mantle.")
          if root.find(".//*[@id='octopus-head']") is None:
              raise SystemExit("Generated aquarium is missing its head.")
          if root.find(".//*[@id='octopus-siphon']") is None:
              raise SystemExit("Generated aquarium is missing its siphon.")
          if root.find(".//*[@id='left-rock']") is None or root.find(".//*[@id='right-rock']") is None:
              raise SystemExit("Generated aquarium is missing its faceted comic reef rocks.")
          text_content = " ".join(node.text or "" for node in root.findall(".//{http://www.w3.org/2000/svg}text"))
          if "{start." in text_content or "{end." in text_content:
              raise SystemExit("Footer contains unevaluated date placeholders.")
          fish = root.find(".//*[@id='reef-feeding-fish']")
          if fish is None or fish.find(".//*[@keySplines]") is None:
              raise SystemExit("Generated feeding fish is missing eased motion.")
          print(f"Validated {path}: {len(days)} days, eight octopus arms, Neon Midnight comic reef, eight armed siphon anatomy, faceted rocks and evaluated dates, {path.stat().st_size:,} bytes.")
          PY

      - name: Commit updated contribution aquarium
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-aquarium.svg
          if git diff --cached --quiet; then
            echo "Contribution artwork is already current."
          else
            git commit -m "Refresh neon contribution aquarium"
            git push origin HEAD:main
          fi
