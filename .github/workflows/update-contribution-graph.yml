name: Update contribution graph

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_contribution_graph.py"
      - ".github/workflows/update-contribution-graph.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artwork-refresh
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Render contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          GITHUB_PROFILE_LOGIN: Kaelith69
        run: python scripts/build_contribution_graph.py

      - name: Validate SVG
        run: |
          python - <<'PY'
          import datetime as dt
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/contributions-neon.svg")
          root = ET.parse(path).getroot()
          cells = root.findall(".//*[@data-date]")
          assert root.attrib["viewBox"] == "0 0 860 154"
          assert len(cells) == 365, len(cells)
          dates = [dt.date.fromisoformat(cell.attrib["data-date"]) for cell in cells]
          assert dates == sorted(dates) and len(set(dates)) == 365
          assert sum(int(cell.attrib["data-count"]) for cell in cells) == int(
              root.attrib["data-total-contributions"]
          )
          assert not root.findall(".//{http://www.w3.org/2000/svg}text")
          print(f"Validated {len(cells)} daily cells.")
          PY

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-neon.svg
          if git diff --cached --quiet; then
            echo "Graph is already current."
          else
            git commit -m "Refresh contribution graph"
            git push origin HEAD:main
          fi
