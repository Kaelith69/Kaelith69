<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identity dossier">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D">
        <animate attributeName="stop-color" values="#080D1D;#101A34;#080D1D" dur="60s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B132B">
        <animate attributeName="stop-color" values="#0B132B;#080D1D;#0B132B" dur="60s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="id-accent-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C653" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4C653" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="860" height="200" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="858" height="198" rx="15" stroke="#273957" stroke-opacity="0.8"/>

  <!-- Dust Nebula Layer -->
  <g opacity="1">
    <circle cx="15%" cy="80%" r="1" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-40; 0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45%" cy="70%" r="1.5" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,-30; 0,0" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="90%" r="1" fill="rgba(244,198,83,0.10)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,-50; 0,0" dur="35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.10;0.03" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88%" cy="50%" r="2" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-20; 0,0" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left accent bar -->
  <rect x="36" y="24" width="2" height="152" rx="1" fill="url(#id-accent-line)"/>

  <!-- Section label -->
  <text x="52" y="38" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="10" fill="#9BAED0" letter-spacing="2">ABOUT</text>
  <circle cx="96" cy="35" r="2" fill="#F4C653" opacity="0.5"/>

  <!-- Bio copy -->
  <text x="52" y="64" font-family="Inter, sans-serif" font-size="13" fill="#FFF0D1">I build systems, tools, and interfaces with an obsession for polish, reliability, and clarity.</text>
  <text x="52" y="84" font-family="Inter, sans-serif" font-size="12" fill="#9BAED0">Interested in software architecture, automation, developer tooling, systems thinking, and elegant engineering.</text>

  <!-- Divider -->
  <line x1="52" y1="100" x2="808" y2="100" stroke="#273957" stroke-width="1" stroke-opacity="0.6"/>

  <!-- YAML block -->
  <g font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="12">
    <!-- col 1 -->
    <text x="52" y="122" fill="#526487">name:</text>
    <text x="120" y="122" fill="#FFF0D1">kaelith69</text>

    <text x="52" y="140" fill="#526487">base:</text>
    <text x="120" y="140" fill="#FFF0D1">Kerala, India</text>

    <text x="52" y="158" fill="#526487">timezone:</text>
    <text x="152" y="158" fill="#FFF0D1">IST · UTC+5:30</text>

    <text x="52" y="176" fill="#526487">approach:</text>
    <text x="158" y="176" fill="#A5C4D4">reliability</text>
    <text x="248" y="176" fill="#526487">&gt;</text>
    <text x="260" y="176" fill="#A5C4D4">complexity</text>

    <!-- col 2 -->
    <text x="460" y="122" fill="#526487">focus:</text>
    <text x="522" y="122" fill="#A5C4D4">systems · tooling · automation</text>

    <text x="460" y="140" fill="#526487">currently:</text>
    <text x="558" y="140" fill="#A5C4D4">building polished things slowly</text>

    <text x="460" y="158" fill="#526487">outside:</text>
    <text x="544" y="158" fill="#A5C4D4">sci-fi · mythology · history · games</text>

    <text x="460" y="176" fill="#526487">status:</text>
    <text x="524" y="176" fill="#A5C4D4">
      <tspan>exploring new tech &amp; art</tspan>
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Corner decoration -->
  <text x="810" y="190" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="9" fill="#273957" text-anchor="end">// identity.json</text>
</svg>
