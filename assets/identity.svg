 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/><circle cx="61.6" cy="0" r="4.2" fill="#55C9C0" stroke="#080D1D" stroke-width="1.5"/></g><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="29s" repeatCount="indefinite"/><circle cx="49" cy="0" r="2.7" fill="#EF8148" stroke="#080D1D" stroke-width="1"/></g></g>
 <g fill="#FFF0D1"><circle cx="18" cy="10" r="0.8" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle cx="155" cy="63" r="1.1" opacity="0.25"><animate attributeName="opacity" values="0.12;0.5700000000000001;0.12" dur="4.7s" begin="0.43s" repeatCount="indefinite"/></circle><circle cx="292" cy="116" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.12;0.69;0.12" dur="6.4s" begin="0.86s" repeatCount="indefinite"/></circle><circle cx="429" cy="169" r="0.7" opacity="0.25"><animate attributeName="opacity" values="0.12;0.81;0.12" dur="8.1s" begin="1.29s" repeatCount="indefinite"/></circle><circle cx="566" cy="38" r="0.8" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="9.8s" begin="1.72s" repeatCount="indefinite"/></circle><circle cx="703" cy="91" r="1.1" opacity="0.25"><animate attributeName="opacity" values="0.12;0.5700000000000001;0.12" dur="3s" begin="2.15s" repeatCount="indefinite"/></circle><circle cx="20" cy="144" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.12;0.69;0.12" dur="4.7s" begin="0s" repeatCount="indefinite"/></circle><circle cx="157" cy="13" r="0.7" opacity="0.25"><animate attributeName="opacity" values="0.12;0.81;0.12" dur="6.4s" begin="0.43s" repeatCount="indefinite"/></circle><circle cx="294" cy="66" r="0.8" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="8.1s" begin="0.86s" repeatCount="indefinite"/></circle><circle cx="431" cy="119" r="1.1" opacity="0.25"><animate attributeName="opacity" values="0.12;0.5700000000000001;0.12" dur="9.8s" begin="1.29s" repeatCount="indefinite"/></circle><circle cx="568" cy="172" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.12;0.69;0.12" dur="3s" begin="1.72s" repeatCount="indefinite"/></circle><circle cx="705" cy="41" r="0.7" opacity="0.25"><animate attributeName="opacity" values="0.12;0.81;0.12" dur="4.7s" begin="2.15s" repeatCount="indefinite"/></circle><circle cx="22" cy="94" r="0.8" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="6.4s" begin="0s" repeatCount="indefinite"/></circle><circle cx="159" cy="147" r="1.1" opacity="0.25"><animate attributeName="opacity" values="0.12;0.5700000000000001;0.12" dur="8.1s" begin="0.43s" repeatCount="indefinite"/></circle><circle cx="296" cy="16" r="1.5" opacity="0.25"><animate attributeName="opacity" values="0.12;0.69;0.12" dur="9.8s" begin="0.86s" repeatCount="indefinite"/></circle><circle cx="433" cy="69" r="0.7" opacity="0.25"><animate attributeName="opacity" values="0.12;0.81;0.12" dur="3s" begin="1.29s" repeatCount="indefinite"/></circle></g>
 <g stroke-linecap="round"><path d="M 30 156 l 28 -9" stroke="url(#cosmic-streak-grad)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.12;1" dur="7s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-38,12;210,-70" dur="7s" begin="0s" repeatCount="indefinite"/></path><path d="M 670 50 l 24 -8" stroke="#55C9C0" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.1;1" dur="11s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-22,8;110,-36" dur="11s" begin="1s" repeatCount="indefinite"/></path></g></g><text x="52" y="38" font-size="10" fill="#F4C653" letter-spacing="2" font-family="Bangers, Impact, Haettenschweiler, Arial Black, sans-serif" font-weight="900">ABOUT</text>
  <circle cx="96" cy="35" r="2" fill="#F4C653" opacity="0.5"/>

  <!-- Bio copy -->
  <text x="52" y="64" font-size="13" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">I build systems, tools, and interfaces with an obsession for polish, reliability, and clarity.</text>
  <text x="52" y="84" font-size="12" fill="#A5C4D4" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Interested in software architecture, automation, developer tooling, systems thinking, and elegant engineering.</text>

  <!-- Divider -->
  <line x1="52" y1="100" x2="808" y2="100" stroke="#526487" stroke-width="1" stroke-opacity="0.6"/>

  <!-- YAML block -->
  <g font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="12">
    <!-- col 1 -->
    <text x="52" y="122" fill="#8DA6BC" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">name:</text>
    <text x="120" y="122" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">kaelith69</text>

    <text x="52" y="140" fill="#8DA6BC" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">base:</text>
    <text x="120" y="140" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Kerala, India</text>

    <text x="52" y="158" fill="#8DA6BC" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">timezone:</text>
    <text x="152" y="158" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">IST · UTC+5:30</text>

    <text x="52" y="176" fill="#8DA6BC" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">approach:</text>
    <text x="158" y="176" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">reliability</text>
    <text x="248" y="176" fill="#8DA6BC" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">&gt;</text>
    <text x="260" y="176" fill="#FFF0D1" stroke="#080D1D" stroke-width="0.45" paint-order="stroke" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">complexity</text>

    <!-- col 2 -->
