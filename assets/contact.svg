<svg width="860" height="110" viewBox="0 0 860 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contact information">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D">
        <animate attributeName="stop-color" values="#080D1D;#101A34;#080D1D" dur="60s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B132B">
        <animate attributeName="stop-color" values="#0B132B;#080D1D;#0B132B" dur="60s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="860" height="110" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="858" height="108" rx="15" stroke="#273957" stroke-opacity="0.8"/>

  <!-- Dust Nebula Layer -->
  <g opacity="1">
    <circle cx="15%" cy="80%" r="1" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-40; 0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45%" cy="70%" r="1.5" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,-30; 0,0" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="90%" r="1" fill="rgba(244,198,83,0.10)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,-50; 0,0" dur="35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.10;0.03" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88%" cy="50%" r="2" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-20; 0,0" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Section label -->
  <text x="40" y="28" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="10" fill="#9BAED0" letter-spacing="2">NETWORK</text>
  <line x1="40" y1="36" x2="820" y2="36" stroke="#273957" stroke-opacity="0.6" stroke-width="1"/>

  <g font-family="Inter, sans-serif" font-size="14" fill="#FFF0D1">
    <!-- Discord -->
    <rect x="40" y="52" width="370" height="42" rx="10" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
    <circle cx="60" cy="73" r="3" fill="#8DA6BC"/>
    <text x="76" y="77" fill="#526487" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="12">discord</text>
    <text x="146" y="77">kaelith6.9</text>
    <text x="236" y="77" fill="#9BAED0" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="11">id: 1413084975938539540</text>

    <!-- Instagram -->
    <rect x="430" y="52" width="390" height="42" rx="10" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
    <circle cx="450" cy="73" r="3" fill="#F4C653"/>
    <text x="466" y="77" fill="#526487" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="12">instagram</text>
    <text x="556" y="77">@kaelith6.9</text>
  </g>

  <!-- Corner tag -->
  <text x="820" y="102" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="9" fill="#273957" text-anchor="end">// ping</text>
</svg>
