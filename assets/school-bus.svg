    </g>
  </g>
  <path d="M0 105H860V156H0Z" fill="#080D2A"/>
  <path d="M0 105H860V109H0Z" fill="#08D6D0"/>
  <path d="M0 145H860" stroke="#D3266E" stroke-width="3"/>
  <path d="M0 127H860" stroke="#F4F5FF" stroke-width="2" stroke-dasharray="62 52" opacity=".8">
    <animate attributeName="stroke-dashoffset" from="0" to="114" dur="1.15s" repeatCount="indefinite"/>
  </path>
  <path d="M0 117H860" stroke="#1746D8" stroke-width="1" opacity=".9"/>
  <path d="M0 151H860" stroke="#D7F51D" stroke-width="1.5" opacity=".65"/>
  <g opacity=".7">
