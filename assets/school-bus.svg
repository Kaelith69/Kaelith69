<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="156" viewBox="0 0 860 156" role="img" aria-labelledby="bus-title bus-desc">
<title id="bus-title">School bus on a moving road</title>
<desc id="bus-desc">A classic long yellow school bus remains fixed in place while its wheels rotate clockwise and the road and scenery move backwards.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102B91"/><stop offset="1" stop-color="#1746D8"/></linearGradient>
  <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF36A"/><stop offset=".28" stop-color="#FFD83D"/><stop offset=".78" stop-color="#F0B923"/><stop offset="1" stop-color="#D99516"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#25385B"/><stop offset="1" stop-color="#080D2A"/></linearGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#F4F5FF" opacity=".22"/></pattern>
  <clipPath id="frame"><rect width="860" height="156"/></clipPath>
  <clipPath id="windows"><path d="M170 38H785Q797 38 807 52L816 67H170Z"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="860" height="156" fill="#080D2A"/>
  <path d="M0 0H860V5H0Z" fill="#D7F51D"/>
  <rect y="5" width="860" height="101" fill="url(#sky)"/>
  <rect y="5" width="860" height="101" fill="url(#dots)"/>
  <g opacity=".78">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-860 0" dur="18s" repeatCount="indefinite"/>
    <g fill="#DCEBFF">
      <path d="M42 34C42 27 48 22 55 22C58 12 68 8 78 12C84 4 98 5 103 15C113 13 121 20 121 29C129 30 133 34 133 40H42Z" opacity=".72"/>
      <path d="M220 22C220 16 226 12 232 13C237 3 250 1 258 9C267 5 278 10 279 20C287 20 293 25 293 31H220Z" opacity=".56"/>
      <path d="M414 39C414 31 421 26 429 27C433 16 446 13 455 21C465 17 477 23 478 33C487 34 492 39 492 45H414Z" opacity=".68"/>
      <path d="M640 25C640 17 647 12 655 14C660 4 674 2 682 11C692 7 704 13 705 23C714 23 720 29 720 35H640Z" opacity=".62"/>
      <path d="M785 51C785 44 791 40 798 41C803 31 816 29 824 37C834 34 844 40 845 50C853 50 858 55 858 61H785Z" opacity=".5"/>
    </g>
    <g transform="translate(860 0)" fill="#DCEBFF">
      <path d="M42 34C42 27 48 22 55 22C58 12 68 8 78 12C84 4 98 5 103 15C113 13 121 20 121 29C129 30 133 34 133 40H42Z" opacity=".72"/>
      <path d="M220 22C220 16 226 12 232 13C237 3 250 1 258 9C267 5 278 10 279 20C287 20 293 25 293 31H220Z" opacity=".56"/>
      <path d="M414 39C414 31 421 26 429 27C433 16 446 13 455 21C465 17 477 23 478 33C487 34 492 39 492 45H414Z" opacity=".68"/>
      <path d="M640 25C640 17 647 12 655 14C660 4 674 2 682 11C692 7 704 13 705 23C714 23 720 29 720 35H640Z" opacity=".62"/>
      <path d="M785 51C785 44 791 40 798 41C803 31 816 29 824 37C834 34 844 40 845 50C853 50 858 55 858 61H785Z" opacity=".5"/>
    </g>
  </g>
  <g opacity=".72">
    <path d="M0 87L78 64L145 79L220 53L306 78L382 55L462 76L542 50L620 72L703 52L790 75L860 57" fill="none" stroke="#08D6D0" stroke-width="1.2" opacity=".55"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-860 0" dur="8s" repeatCount="indefinite"/>
      <path d="M30 75l12 -18 12 18M100 78l17 -28 17 28M185 73l13 -20 13 20M280 78l18 -31 18 31M390 72l13 -22 13 22M505 78l17 -30 17 30M620 73l13 -23 13 23M740 78l18 -32 18 32M840 75l12 -18 12 18" fill="none" stroke="#D7F51D" stroke-width="2" opacity=".42"/>
