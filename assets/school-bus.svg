      <animate attributeName="stroke-dashoffset" from="0" to="130" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Fixed bus shadow -->
  <ellipse cx="449" cy="111" rx="394" ry="7" fill="#00030D" opacity=".72"/>

  <!-- Fixed classic full length school bus -->
  <g id="school-bus">
    <!-- roof and long body -->
    <path d="M128 31Q128 22 142 22H775Q799 22 815 42L837 72Q842 79 842 91V105H94V77Q94 61 107 51L128 31Z" fill="url(#yellow)" stroke="#080D2A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M141 26H775Q796 26 809 44L826 66H125V42Q125 26 141 26Z" fill="#FFE45A" opacity=".55"/>
    <!-- front hood and grille, left facing front -->
    <path d="M95 68L145 58V102H73Q55 102 50 91L38 83Q34 78 41 73L95 68Z" fill="url(#yellow)" stroke="#080D2A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M42 80Q49 67 68 63L111 56L120 68L70 79Z" fill="#FFD83D" stroke="#080D2A" stroke-width="3"/>
    <path d="M42 83L61 83V94H43Q36 91 42 83Z" fill="#F4F5FF" stroke="#080D2A" stroke-width="2"/>
    <path d="M75 91H101V101H75Z" fill="#202A45" stroke="#080D2A" stroke-width="2"/>
    <path d="M113 61V102" stroke="#080D2A" stroke-width="4"/>
    <!-- windshield -->
    <path d="M132 35H163V68H119L124 49Q126 39 132 35Z" fill="url(#glass)" stroke="#080D2A" stroke-width="3"/>
    <path d="M127 42L154 39" stroke="#8FA8C9" stroke-width="2" opacity=".6"/>
    <!-- passenger windows -->
    <g clip-path="url(#windows)">
      <path d="M170 37H816V69H170Z" fill="url(#glass)"/>
      <path d="M180 38L208 38L184 68H170Z M267 38L294 38L270 68H243Z M354 38L381 38L357 68H330Z M441 38L468 38L444 68H417Z M528 38L555 38L531 68H504Z M615 38L642 38L618 68H591Z M702 38L729 38L705 68H678Z" fill="#8FA8C9" opacity=".12"/>
      <path d="M170 67H818" stroke="#08D6D0" stroke-width="1.5" opacity=".25"/>
    </g>
    <path d="M170 35H812" stroke="#080D2A" stroke-width="4"/>
    <path d="M170 70H823" stroke="#080D2A" stroke-width="4"/>
    <path d="M170 35V70M248 35V70M326 35V70M404 35V70M482 35V70M560 35V70M638 35V70M716 35V70M794 35V70M822 47V70" stroke="#080D2A" stroke-width="4"/>
    <path d="M170 37H812" stroke="#D7F51D" stroke-width="1.5" opacity=".85"/>
    <!-- iconic black side stripes -->
    <path d="M113 75H829V83H113Z" fill="#080D2A"/>
    <path d="M111 87H832V91H111Z" fill="#080D2A" opacity=".9"/>
    <!-- body panels and wheel arches -->
    <path d="M110 94H820V104H110Z" fill="#E3A91E"/>
    <path d="M119 94H156V103H119Z M226 94H270V103H226Z M320 94H366V103H320Z M424 94H468V103H424Z M576 94H622V103H576Z M724 94H772V103H724Z" fill="#C98D18" opacity=".75"/>
    <path d="M140 101Q140 76 165 76Q190 76 190 101" fill="#080D2A"/>
    <path d="M632 101Q632 76 658 76Q684 76 684 101" fill="#080D2A"/>
    <!-- front and rear lights -->
    <rect x="99" y="72" width="8" height="6" rx="1" fill="#D3266E" stroke="#080D2A" stroke-width="1.5"/>
    <rect x="830" y="76" width="7" height="7" rx="1" fill="#D3266E" stroke="#080D2A" stroke-width="1.5"/>
    <rect x="830" y="88" width="7" height="6" rx="1" fill="#F4F5FF" stroke="#080D2A" stroke-width="1.5"/>
    <!-- folded stop arm and side mirror -->
    <path d="M288 82V94" stroke="#080D2A" stroke-width="2"/>
    <path d="M279 83H298V94H279Z" fill="#D3266E" stroke="#080D2A" stroke-width="2"/>
    <path d="M112 46L99 39L96 47" fill="none" stroke="#080D2A" stroke-width="3"/>
    <path d="M93 39L101 35L106 40L99 44Z" fill="#202A45" stroke="#080D2A" stroke-width="2"/>
    <!-- roof warning lights -->
    <g fill="#D3266E" stroke="#080D2A" stroke-width="1.5">
      <rect x="144" y="17" width="12" height="6" rx="1"/><rect x="167" y="17" width="12" height="6" rx="1"/>
      <rect x="766" y="17" width="12" height="6" rx="1"/><rect x="789" y="17" width="12" height="6" rx="1"/>
    </g>
    <path d="M145 105H818" stroke="#080D2A" stroke-width="4"/>
    <!-- wheels stay at fixed positions; only the inner wheel assemblies rotate -->
    <g>
      <circle cx="165" cy="105" r="27" fill="#050812" stroke="#F4F5FF" stroke-width="2"/>
      <circle cx="165" cy="105" r="20" fill="#242C3E" stroke="#080D2A" stroke-width="3"/>
      <g transform="translate(165 105)">
        <g>
          <path d="M0 -17L4 -8L13 -12L9 -3L18 0L9 4L13 13L4 9L0 18L-4 9L-13 13L-9 4L-18 0L-9 -4L-13 -13L-4 -9Z" fill="#D7F51D" stroke="#080D2A" stroke-width="1.5"/>
          <circle r="8" fill="#C98D18" stroke="#080D2A" stroke-width="2"/>
          <circle r="3" fill="#08D6D0"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".72s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
    <g>
      <circle cx="658" cy="105" r="27" fill="#050812" stroke="#F4F5FF" stroke-width="2"/>
      <circle cx="658" cy="105" r="20" fill="#242C3E" stroke="#080D2A" stroke-width="3"/>
      <g transform="translate(658 105)">
        <g>
          <path d="M0 -17L4 -8L13 -12L9 -3L18 0L9 4L13 13L4 9L0 18L-4 9L-13 13L-9 4L-18 0L-9 -4L-13 -13L-4 -9Z" fill="#D7F51D" stroke="#080D2A" stroke-width="1.5"/>
          <circle r="8" fill="#C98D18" stroke="#080D2A" stroke-width="2"/>
          <circle r="3" fill="#08D6D0"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".72s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>
