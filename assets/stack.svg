<svg width="860" height="140" viewBox="0 0 860 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology stack">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D">
        <animate attributeName="stop-color" values="#080D1D;#101A34;#080D1D" dur="60s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B132B">
        <animate attributeName="stop-color" values="#0B132B;#080D1D;#0B132B" dur="60s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="860" height="140" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="858" height="138" rx="15" stroke="#273957" stroke-opacity="0.8"/>

  <!-- Dust Nebula Layer -->
  <g opacity="1">
    <circle cx="15%" cy="80%" r="1" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-40; 0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45%" cy="70%" r="1.5" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,-30; 0,0" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="90%" r="1" fill="rgba(244,198,83,0.10)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 25,-50; 0,0" dur="35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.10;0.03" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88%" cy="50%" r="2" fill="rgba(85,201,192,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-20; 0,0" dur="28s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Section label -->
  <text x="40" y="26" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="11" fill="#9BAED0" letter-spacing="2">STACK</text>

  <!-- Row label: Core & Frontend -->
  <text x="40" y="60" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="10" fill="#526487" letter-spacing="1">dev</text>

  <g font-family="Inter, sans-serif" font-size="13" fill="#FFF0D1">
    <!-- Row 1: Dev -->
    <g>
      <rect x="80" y="46" width="90" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="94" cy="59" r="3" fill="#F4C653"/>
      <text x="105" y="64">Python</text>
    </g>
    <g>
      <rect x="180" y="46" width="110" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="194" cy="59" r="3" fill="#8DA6BC"/>
      <text x="205" y="64">JavaScript</text>
    </g>
    <g>
      <rect x="300" y="46" width="80" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="314" cy="59" r="3" fill="#F4C653"/>
      <text x="325" y="64">HTML</text>
    </g>
    <g>
      <rect x="390" y="46" width="70" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="404" cy="59" r="3" fill="#526487"/>
      <text x="415" y="64">CSS</text>
    </g>
    <g>
      <rect x="470" y="46" width="80" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="484" cy="59" r="3" fill="#8DA6BC"/>
      <text x="495" y="64">React</text>
    </g>
    <g>
      <rect x="560" y="46" width="90" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="574" cy="59" r="3" fill="#F4C653"/>
      <text x="585" y="64">Flutter</text>
    </g>

    <!-- Row label: Environment -->
    <text x="40" y="106" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="10" fill="#526487" letter-spacing="1">env</text>

    <!-- Row 2: Environment -->
    <g>
      <rect x="80" y="92" width="80" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="94" cy="105" r="3" fill="#526487"/>
      <text x="105" y="110">Linux</text>
    </g>
    <g>
      <rect x="170" y="92" width="90" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="184" cy="105" r="3" fill="#F4C653"/>
      <text x="195" y="110">VS Code</text>
    </g>
    <g>
      <rect x="270" y="92" width="90" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="284" cy="105" r="3" fill="#8DA6BC"/>
      <text x="295" y="110">GitHub</text>
    </g>
    <g>
      <rect x="370" y="92" width="70" height="26" rx="13" fill="#0B132B" stroke="#273957" stroke-opacity="0.8"/>
      <circle cx="384" cy="105" r="3" fill="#F4C653"/>
      <text x="395" y="110">Git</text>
    </g>
  </g>

  <!-- Corner tag -->
  <text x="820" y="130" font-family="'JetBrains Mono','SFMono-Regular',monospace" font-size="9" fill="#273957" text-anchor="end">// curated</text>
</svg>
