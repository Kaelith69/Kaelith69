<svg xmlns="http://www.w3.org/2000/svg" width="640" height="76" viewBox="0 0 640 76">
<defs>
  <linearGradient id="cosmic-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1D"/>
    <stop offset=".55" stop-color="#101A34"/>
    <stop offset="1" stop-color="#17213E"/>
  </linearGradient>
  <radialGradient id="nebula">
    <stop stop-color="#6C3D87" stop-opacity=".4"/>
    <stop offset="1" stop-color="#6C3D87" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFF0D1"/>
    <stop offset=".5" stop-color="#F4C653"/>
    <stop offset="1" stop-color="#D7C3A3"/>
  </linearGradient>
  <pattern id="fine-stars" width="17" height="17" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="4" r=".65" fill="#FFF0D1" opacity=".28"/>
    <circle cx="13" cy="12" r=".45" fill="#55C9C0" opacity=".23"/>
  </pattern>
  <clipPath id="panel"><rect width="640" height="76" rx="13"/></clipPath>
  <filter id="brass-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#panel)">
  <rect width="640" height="76" fill="url(#cosmic-bg)"/>
  <ellipse cx="325" cy="38" rx="300" ry="92" fill="url(#nebula)" opacity=".7"/>
  <rect width="640" height="76" fill="url(#fine-stars)"/>
  <g fill="#FFF0D1">
    <circle cx="132" cy="12" r=".8"><animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="62" r=".7"><animate attributeName="opacity" values=".12;.8;.12" dur="5.6s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="15" r="1"><animate attributeName="opacity" values=".1;.85;.1" dur="6.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="402" cy="59" r=".7"><animate attributeName="opacity" values=".12;.8;.12" dur="4.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="482" cy="12" r=".9"><animate attributeName="opacity" values=".1;.9;.1" dur="5.2s" begin=".3s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(52 38)">
    <circle r="30" fill="none" stroke="#8DA6BC" stroke-opacity=".22" stroke-width="1"/>
    <circle r="26" fill="none" stroke="url(#brass)" stroke-width="1.3" stroke-dasharray="2 4" opacity=".8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#55C9C0" stroke-width="1.1" stroke-dasharray="12 7" opacity=".72">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="27s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -17V-12 M0 17V12 M-17 0H-12 M17 0H12" stroke="#F4C653" stroke-width="1.3" opacity=".8"/>
    <circle r="11" fill="#101A34" stroke="#D7C3A3" stroke-opacity=".6" stroke-width="1"/>
    <path d="M0 -7V0L7 -3" fill="none" stroke="#FFF0D1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="2.6" fill="#F4C653" filter="url(#brass-glow)">
      <animate attributeName="r" values="2.1;3.2;2.1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M96 18V58" stroke="#8DA6BC" stroke-opacity=".3"/>
  <text x="119" y="50" font-family="Bangers, Impact, 'Arial Black', sans-serif" font-size="27" letter-spacing="2.1" fill="#FFF0D1" stroke="#080D1D" stroke-width="2.2" paint-order="stroke">PROFILE</text>
  <path d="M120 57H232" stroke="url(#brass)" stroke-width="1.4" opacity=".85"/>
  <path d="M244 56l5 -5 5 5 -5 5Z" fill="#F4C653" opacity=".85"/>
  <g transform="translate(574 38)">
    <circle r="27" fill="url(#nebula)" opacity=".65"/>
    <circle r="22" fill="none" stroke="#55C9C0" stroke-opacity=".45" stroke-width="1" stroke-dasharray="1.5 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="none" stroke="#F4C653" stroke-opacity=".65" stroke-width="1.2" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="29s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -12V-7 M0 0L8 -3" stroke="#FFF0D1" stroke-width="1.4" stroke-linecap="round"/>
    <circle r="2.4" fill="#F4C653" filter="url(#brass-glow)"/>
    <circle cx="18" cy="-13" r="2.2" fill="#55C9C0"/>
  </g>
  <path d="M612 14L630 8M612 62L630 68" stroke="#F4C653" stroke-width="1" opacity=".4"/>
</g>
<rect x=".7" y=".7" width="638.6" height="74.6" rx="12.3" fill="none" stroke="#526487" stroke-opacity=".85"/>
</svg>