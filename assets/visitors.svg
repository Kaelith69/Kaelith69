<svg xmlns="http://www.w3.org/2000/svg" width="720" height="80" viewBox="0 0 720 80">
<defs>
  <linearGradient id="cosmic-bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080D1D"/><stop offset=".55" stop-color="#101A34"/><stop offset="1" stop-color="#17213E"/>
  </linearGradient>
  <radialGradient id="nebula"><stop stop-color="#6C3D87" stop-opacity=".38"/><stop offset="1" stop-color="#6C3D87" stop-opacity="0"/></radialGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFF0D1"/><stop offset=".5" stop-color="#F4C653"/><stop offset="1" stop-color="#D7C3A3"/>
  </linearGradient>
  <pattern id="fine-stars" width="19" height="19" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="4" r=".65" fill="#FFF0D1" opacity=".26"/><circle cx="14" cy="13" r=".45" fill="#55C9C0" opacity=".22"/>
  </pattern>
  <clipPath id="panel"><rect width="720" height="80" rx="14"/></clipPath>
  <filter id="brass-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#panel)">
  <rect width="720" height="80" fill="url(#cosmic-bg)"/>
  <ellipse cx="365" cy="40" rx="310" ry="100" fill="url(#nebula)" opacity=".72"/>
  <ellipse cx="690" cy="12" rx="110" ry="78" fill="url(#nebula)" opacity=".55"/>
  <rect width="720" height="80" fill="url(#fine-stars)"/>
  <g fill="#FFF0D1">
    <circle cx="132" cy="12" r=".8"><animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="66" r=".7"><animate attributeName="opacity" values=".12;.8;.12" dur="5.6s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="15" r="1"><animate attributeName="opacity" values=".1;.85;.1" dur="6.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="375" cy="63" r=".7"><animate attributeName="opacity" values=".12;.8;.12" dur="4.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="423" cy="11" r=".9"><animate attributeName="opacity" values=".1;.9;.1" dur="5.2s" begin=".3s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(48 40)">
    <circle r="31" fill="none" stroke="#8DA6BC" stroke-opacity=".22" stroke-width="1"/>
    <circle r="27" fill="none" stroke="url(#brass)" stroke-width="1.3" stroke-dasharray="2 4" opacity=".82">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#55C9C0" stroke-width="1.1" stroke-dasharray="12 7" opacity=".72">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="27s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -17V-12 M0 17V12 M-17 0H-12 M17 0H12" stroke="#F4C653" stroke-width="1.3" opacity=".8"/>
    <circle r="11" fill="#101A34" stroke="#D7C3A3" stroke-opacity=".6" stroke-width="1"/>
    <path d="M0 -7V0L7 -3" fill="none" stroke="#FFF0D1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="2.6" fill="#F4C653" filter="url(#brass-glow)"><animate attributeName="r" values="2.1;3.2;2.1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M91 19V61" stroke="#8DA6BC" stroke-opacity=".28"/>
  <text x="119" y="50" font-family="Bangers, Impact, 'Arial Black', sans-serif" font-size="29" letter-spacing="2" fill="#FFF0D1" stroke="#080D1D" stroke-width="2.2" paint-order="stroke">PROFILE</text>
  <path d="M120 59H254" stroke="url(#brass)" stroke-width="1.2" opacity=".65"/>
  <path d="M270 58l5 -5 5 5 -5 5Z" fill="#F4C653" opacity=".75"/>
  <g transform="translate(426 13)">
    <rect width="270" height="54" rx="9" fill="#080D1D" fill-opacity=".52" stroke="#D7C3A3" stroke-opacity=".4"/>
    <rect x="1" y="1" width="268" height="52" rx="8" fill="none" stroke="#55C9C0" stroke-opacity=".16"/>
    <text x="20" y="21" font-family="Trebuchet MS,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2.4" fill="#55C9C0">VISITS</text>
    <text id="visitor-count" x="20" y="46" font-family="Bangers, Impact, 'Arial Black', sans-serif" font-size="27" letter-spacing="1.2" fill="#FFF0D1" stroke="#080D1D" stroke-width="1.8" paint-order="stroke">471</text>
    <g transform="translate(238 27)">
      <circle r="15" fill="url(#nebula)" opacity=".7"/>
      <circle r="13" fill="none" stroke="#F4C653" stroke-opacity=".65" stroke-width="1" stroke-dasharray="2 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="none" stroke="#55C9C0" stroke-opacity=".7" stroke-width="1" stroke-dasharray="7 4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" fill="#F4C653" filter="url(#brass-glow)"/>
    </g>
  </g>
</g>
<rect x=".7" y=".7" width="718.6" height="78.6" rx="13.3" fill="none" stroke="#526487" stroke-opacity=".85"/>
</svg>