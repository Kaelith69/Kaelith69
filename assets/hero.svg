<svg width="860" height="180" viewBox="0 0 860 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kaelith69 profile hero">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D">
        <animate attributeName="stop-color" values="#080D1D;#101A34;#080D1D" dur="60s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B132B">
        <animate attributeName="stop-color" values="#0B132B;#080D1D;#0B132B" dur="60s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <radialGradient id="hero-vignette" cx="0.5" cy="0.4" r="0.8">
