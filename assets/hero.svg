<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Kaelith69 profile banner</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080D1D"/>
      <stop offset="1" stop-color="#101A34"/>
    </linearGradient>
    <linearGradient id="hero-edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A855F7"/>
      <stop offset=".55" stop-color="#35D9E6"/>
      <stop offset="1" stop-color="#C6F432"/>
    </linearGradient>
    <radialGradient id="hero-violet">
      <stop stop-color="#A855F7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-cyan">
      <stop stop-color="#35D9E6" stop-opacity=".17"/>
      <stop offset="1" stop-color="#35D9E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D8DCE8" stroke-opacity=".045" stroke-width=".6"/>
    </pattern>
    <clipPath id="hero-clip"><rect width="860" height="180"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="860" height="180" fill="url(#hero-bg)"/>
    <rect width="860" height="180" fill="url(#hero-grid)"/>
    <ellipse cx="700" cy="88" rx="245" ry="150" fill="url(#hero-violet)"/>
    <ellipse cx="770" cy="120" rx="180" ry="100" fill="url(#hero-cyan)"/>

    <path d="M0 0H860V5H0Z" fill="url(#hero-edge)" opacity=".9"/>
    <path d="M0 175H860V180H0Z" fill="#101A34"/>
    <path d="M28 25H470M28 25V155M28 155H470" fill="none" stroke="#D8DCE8" stroke-opacity=".16"/>
    <path d="M505 0L620 0L505 180H390Z" fill="#101A34" opacity=".42"/>
    <path d="M566 0H860V180H680L566 0Z" fill="#080D1D" opacity=".36"/>
    <path d="M575 0L690 180M606 0L721 180M637 0L752 180" stroke="#35D9E6" stroke-opacity=".09"/>
    <path d="M0 160H340" stroke="url(#hero-edge)" stroke-opacity=".45"/>

    <g transform="translate(704 90)">
      <ellipse rx="91" ry="37" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-opacity=".7" transform="rotate(-31)">
        <animateTransform attributeName="transform" type="rotate" from="-31" to="329" dur="72s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="68" ry="27" fill="none" stroke="#35D9E6" stroke-width="1" stroke-opacity=".62" transform="rotate(48)">
        <animateTransform attributeName="transform" type="rotate" from="48" to="-312" dur="96s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M0 -54L47 0L0 54L-47 0Z" fill="#101A34" fill-opacity=".8" stroke="#A855F7" stroke-width="1.4"/>
      <path d="M0 -34L30 0L0 34L-30 0Z" fill="none" stroke="#35D9E6" stroke-width="1.2"/>
      <path d="M0 -17L17 0L0 17L-17 0Z" fill="#A855F7" fill-opacity=".75"/>
      <circle r="5" fill="#C6F432">
        <animate attributeName="opacity" values=".65;1;.65" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <path d="M-104 0H-78M78 0H104M0 -66V-50M0 50V66" stroke="#D8DCE8" stroke-opacity=".42"/>
      <circle cx="91" cy="-37" r="3" fill="#C6F432"/>
      <circle cx="-86" cy="42" r="2.2" fill="#35D9E6"/>
    </g>

    <path d="M835 24H850V39M10 141V156H25" fill="none" stroke="#C6F432" stroke-width="1.5" stroke-opacity=".8"/>
    <path d="M475 26L505 26L475 56Z" fill="#A855F7" opacity=".65"/>
    <path d="M474 154L502 126" stroke="#35D9E6" stroke-width="1.2" stroke-opacity=".7"/>

    <g>
      <text x="70" y="88" font-family="'Cormorant Garamond','Libre Baskerville',Georgia,serif" font-size="39" font-weight="600" fill="#D8DCE8" letter-spacing="1.1">Kaelith69</text>
      <path d="M72 99H176" stroke="#A855F7" stroke-width="1.5"/>
      <text x="72" y="119" font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#35D9E6" letter-spacing=".7">Kerala · IST · UTC+5:30</text>
      <text x="72" y="140" font-family="Inter,Arial,sans-serif" font-size="12" fill="#D8DCE8" fill-opacity=".82">builder · gamer · exploring new tech and art</text>
    </g>
  </g>
</svg>
