      <animateTransform attributeName="transform" type="translate" values="-1500,-500; 1000,500" dur="25s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outline -->
  <rect x="24" y="26" width="812" height="128" rx="14" fill="none" stroke="#273957" stroke-opacity="0.6"/>

  <!-- Dust Nebula Layer (Layer 2) -->
