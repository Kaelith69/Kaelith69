  <rect x="1" y="1" width="858" height="78" rx="15" stroke="#526487" stroke-opacity="0.8"/>

  <!-- Dust Nebula Layer -->
  <g opacity="1">
    <circle cx="15%" cy="80%" r="1" fill="rgba(110,160,255,0.08)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,-40; 0,0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45%" cy="70%" r="1.5" fill="rgba(110,160,255,0.08)">
