  <line x1="710" y1="40" x2="770" y2="40" stroke="#526487" stroke-opacity="0.8"/>
  <circle cx="150" cy="40" r="2" fill="#F4C653"/>
  <circle cx="710" cy="40" r="2" fill="#F4C653"/>

